# Publica la web en GitHub Pages.
# Antes pasa a la app las ayudas que hayas aprobado y comprueba que todo está bien escrito.
name: Publicar la web

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pasar a la app las ayudas aprobadas
        run: python scripts/aprobar.py

      - name: Comprobar que las ayudas están bien escritas
        run: python scripts/validar.py

      - name: Guardar los cambios
        run: |
          git config user.name "reformayuda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data revision
          git diff --cached --quiet || (git commit -m "Publica ayudas revisadas" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4
