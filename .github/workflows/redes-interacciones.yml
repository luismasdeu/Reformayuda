# Cada 15 minutos: contesta las palabras clave, agradece, oculta spam y prepara
# borradores de respuesta a preguntas (se aprueban en obrayuda.es/revisar/).
name: Redes · comentarios y mensajes

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: redes-interacciones
  cancel-in-progress: false

jobs:
  pasada:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/redes-interacciones.yml
      - run: pip install --quiet anthropic==2.3.0 firebase-admin==6.5.0
      - name: Revisar comentarios y mensajes
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/redes/interacciones.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "reformayuda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revision/redes-interacciones.json revision/redes-respuestas.json revision/gasto-ia.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -q -m "Redes: comentarios y mensajes" && (git pull --rebase -q && git push -q || (git rebase --abort 2>/dev/null; echo "Se guardará en la siguiente pasada")))
