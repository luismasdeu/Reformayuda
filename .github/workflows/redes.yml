# Publica en Instagram y Facebook (ver scripts/redes/redes.py):
# un carrusel a mediodía (lunes a sábado) y un reel por la tarde (todos los días).
name: Redes sociales

on:
  schedule:
    - cron: "17 11 * * *"   # carrusel · 12:17 en invierno / 13:17 en verano (hora de España)
    - cron: "43 18 * * *"   # reel     · 19:43 en invierno / 20:43 en verano
  workflow_dispatch:
    inputs:
      formato:
        description: "Qué publicar"
        type: choice
        options: [reel, carrusel]
        default: reel
      nombre:
        description: "Reel concreto a publicar (nombre del guion, opcional)"
        type: string
        default: ""
      usar_prueba:
        description: "Usar el vídeo ya generado en docs/redes/pruebas/ si existe"
        type: boolean
        default: false
      forzar:
        description: "Publicar el carrusel aunque sea domingo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: redes
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      FORMATO: ${{ inputs.formato || (github.event.schedule == '43 18 * * *' && 'reel' || 'carrusel') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Comprobar si Meta está configurado
        id: meta
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: |
          if [ -n "$META_PAGE_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "Falta el secreto META_PAGE_TOKEN: no publico en redes."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v6
        if: steps.meta.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Incorporar el contenido aprobado en /revisar/
        if: steps.meta.outputs.ok == 'true'
        run: |
          python scripts/redes/redes.py incorporar
          git config user.name "reformayuda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/redes revision/redes-propuestas.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Redes: incorpora contenido aprobado" && (for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break || (git rebase --abort 2>/dev/null; sleep 7); done))

      - name: Decidir qué toca hoy
        if: steps.meta.outputs.ok == 'true'
        id: plan
        env:
          TZ: Europe/Madrid
          FORZAR: ${{ inputs.forzar && '1' || '' }}
          NOMBRE: ${{ inputs.nombre }}
        run: python scripts/redes/redes.py planificar "$FORMATO"

      - name: Preparar las herramientas
        if: steps.plan.outputs.carpeta != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet edge-tts==7.3.1 piper-tts==1.8.0
          mkdir -p ~/piper && cd ~/piper && for f in es_ES-davefx-medium.onnx es_ES-davefx-medium.onnx.json; do curl -sSfL -o $f "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium/$f"; done && cd - > /dev/null
          echo "PIPER_MODELO=$HOME/piper/es_ES-davefx-medium.onnx" >> "$GITHUB_ENV"
          npm install --no-save --silent playwright@1.49.1
          npx playwright install --with-deps chromium > /dev/null

      - name: Generar el carrusel o el reel
        if: steps.plan.outputs.carpeta != ''
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          C="${{ steps.plan.outputs.carpeta }}"
          P="docs/redes/pruebas/${{ inputs.nombre }}.mp4"
          if [ "$FORMATO" = reel ] && [ "${{ inputs.usar_prueba }}" = true ] && [ -f "$P" ]; then cp "$P" "$C/reel.mp4"; echo "Uso el vídeo ya revisado: $P"
          elif [ "$FORMATO" = reel ]; then node scripts/redes/reel.mjs "$C/spec.json" "$C"; else node scripts/redes/carrusel.mjs "$C/spec.json" "$C"; fi

      - name: Subir las imágenes (Instagram las descarga desde GitHub)
        if: steps.plan.outputs.carpeta != ''
        run: |
          git config user.name "reformayuda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.plan.outputs.carpeta }}" revision/redes-videos-usados.json 2>/dev/null || git add "${{ steps.plan.outputs.carpeta }}"
          git diff --cached --quiet || (git commit -m "Redes: $FORMATO de $(date +%F)" && (for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break || (git rebase --abort 2>/dev/null; sleep 7); done))

      - name: Publicar en Instagram y Facebook
        if: steps.plan.outputs.carpeta != ''
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: python scripts/redes/redes.py publicar "${{ steps.plan.outputs.carpeta }}"

      - name: Guardar el reel para revisarlo
        if: always() && steps.plan.outputs.carpeta != '' && env.FORMATO == 'reel'
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: ${{ steps.plan.outputs.carpeta }}/reel.mp4
          retention-days: 14

      - name: Guardar el registro
        if: always() && steps.plan.outputs.carpeta != ''
        run: |
          git add revision/redes.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Redes: registro $(date +%F)" && (for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break || (git rebase --abort 2>/dev/null; sleep 7); done))
