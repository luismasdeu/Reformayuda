# Genera un reel de prueba (con voz) sin publicarlo. Se descarga en «Artifacts».
name: Probar un reel

on:
  workflow_dispatch:
    inputs:
      guion:
        description: "Guion en docs/redes/reels/ (sin .json)"
        default: 02-ventanas-hacienda

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet edge-tts==7.3.1 piper-tts==1.8.0
          mkdir -p ~/piper && cd ~/piper && for f in es_ES-davefx-medium.onnx es_ES-davefx-medium.onnx.json; do curl -sSfL -o $f "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium/$f"; done && cd - > /dev/null
          echo "PIPER_MODELO=$HOME/piper/es_ES-davefx-medium.onnx" >> "$GITHUB_ENV"
          npm install --no-save --silent playwright@1.49.1
          npx playwright install --with-deps chromium > /dev/null
      - run: node scripts/redes/reel.mjs "docs/redes/reels/${{ inputs.guion }}.json" salida
      - uses: actions/upload-artifact@v4
        with:
          name: reel-prueba
          path: salida/
          retention-days: 7
