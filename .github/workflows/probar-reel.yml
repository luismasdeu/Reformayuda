# Genera reels de prueba (con voz) sin publicarlos y los guarda en docs/redes/pruebas/.
name: Probar reels

on:
  workflow_dispatch:
    inputs:
      guion:
        description: "Guion en docs/redes/reels/ (sin .json), o «todos»"
        default: todos

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Preparar las herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet edge-tts==7.3.1 piper-tts==1.8.0
          mkdir -p ~/piper && cd ~/piper && for f in es_ES-davefx-medium.onnx es_ES-davefx-medium.onnx.json; do curl -sSfL -o $f "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium/$f"; done && cd - > /dev/null
          echo "PIPER_MODELO=$HOME/piper/es_ES-davefx-medium.onnx" >> "$GITHUB_ENV"
          npm install --no-save --silent playwright@1.49.1
          npx playwright install --with-deps chromium > /dev/null
      - name: Generar
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p docs/redes/pruebas
          if [ "${{ inputs.guion }}" = todos ]; then L=$(ls docs/redes/reels/*.json); else L=$(for g in ${{ inputs.guion }}; do echo docs/redes/reels/$g.json; done); fi
          for g in $L; do n=$(basename $g .json); node scripts/redes/reel.mjs "$g" "/tmp/r/$n" && cp "/tmp/r/$n/reel.mp4" "docs/redes/pruebas/$n.mp4"; done
      - name: Guardar
        run: |
          git config user.name "reformayuda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/redes/pruebas; git add revision/redes-videos-usados.json 2>/dev/null || true
          git commit -m "Redes: reels de prueba" && git pull --rebase -q && git push
